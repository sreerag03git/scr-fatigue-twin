[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scr_twin_core"
version = "0.1.0"
description = "Physics core for a real-time SCR fatigue digital twin (MRU motion -> TDP fatigue remaining-life posterior)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "SCR Twin project" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    # Upper bound is load-bearing, not tidiness. pandas 3 made PyArrow-backed
    # strings the default storage, and that path segfaults in CI on the
    # resolved pyarrow: the API job died with SIGSEGV inside
    # pandas.core.arrays.string_arrow._from_sequence, reading the MRU CSV in
    # ingest.load_mru_csv. Not a test failure - a core dump, so nothing was
    # reported. This code was written against pandas 2.x; supporting 3.x is
    # real work rather than a version bump, and belongs in its own change.
    "pandas>=2.2,<3",
    "pyarrow>=17",
]

[project.optional-dependencies]
test = ["pytest>=7", "rainflow>=3", "fatpack>=0.7"]
dev = ["ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scr_twin_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
